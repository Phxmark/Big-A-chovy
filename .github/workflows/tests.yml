name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s daily-stock-analysis/scripts -p 'test_*.py'
        env:
          BIG_A_CHOVY_SKIP_STARTUP_PROBE: '1'
